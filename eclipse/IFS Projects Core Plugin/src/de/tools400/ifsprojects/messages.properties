Tooltip_Build_mode=Specifies, where the build and compile commands of the IFS projects run.
Tooltip_Build_mode_terminal=The commands run in the SSH terminal of the project. The terminal shows the output, while the command is running. Afterwards the errors of the compiled objects are shown in the Error List view.
Tooltip_Build_mode_rse=The commands run in a job of the RSE connection. No SSH login is required. The output is shown in the Commands Log view, the errors of the compiled objects in the Error List view.
Tooltip_SSH_port=Port of the SSH server of the IBM i.
Tooltip_Connection_timeout=Maximum time in seconds for establishing the SSH connection.
Tooltip_Keep_alive_interval=Interval in seconds, in which keep alive messages are sent, so that idle connections are not closed.
Tooltip_Encoding=Character encoding of the terminals, e.g. UTF-8.
Tooltip_Convert_user_ID_to_lowercase=Converts the user ID of the RSE connection to lowercase for the SSH login, e.g. JSMITH to jsmith.
Tooltip_Use_password_saved_in_RSE=Uses the password saved for the RSE connection for the SSH login, e.g. if no SSH key is configured.
Tooltip_Restore_terminals_after_restart=Restores the terminals disconnected after a restart of RDi. Otherwise they are closed, when RDi shuts down.
Tooltip_Reuse_build_terminal=Build and compile commands of a project run in the same terminal, unless it still runs a command of the plug-in. Otherwise each command opens a new terminal. Only used, if the commands run in the SSH terminal.
Tooltip_Default_build_command=Builds an IFS project, if its iproj.json file does not specify a build command.
Tooltip_Default_environment_variables=Exported before the build and compile commands of all IFS projects, e.g. ENVCMD=CHGSYSLIBL LIB(UBMSYS) OPTION(*REMOVE) for "setIBMiEnvCmd": ["&ENVCMD"] in iproj.json. One variable per line: NAME=value. Lines starting with # are ignored. The environment variables of an IFS project override these defaults.
