Tooltip_Build_mode=Specifies, where the build and compile commands of the IFS projects run.
Tooltip_Build_mode_terminal=The commands run in the SSH terminal of the project. The terminal shows the output, while the command is running. Afterwards the errors of the compiled objects are shown in the Error List view.
Tooltip_Build_mode_rse=The commands run in a job of the RSE connection. No SSH login is required. The output is shown in the Commands Log view, the errors of the compiled objects in the Error List view.
