# feature.properties
# contains externalized strings for feature.xml
# "%foo" in feature.xml corresponds to the key "foo" in this file
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# This file should be translated.

# "description" property - description of the feature
description=\
Lets AI agents like Claude Code compile the files of local IFS projects on the IBM i and check \
their syntax there: adds the tools "ifs_projects_compile" and "ifs_projects_check_syntax" to the \
MCP server of iAgentBridge. Requires iAgentBridge 1.1.0 or later.

