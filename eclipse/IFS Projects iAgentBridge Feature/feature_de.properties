# feature.properties
# contains externalized strings for feature.xml
# "%foo" in feature.xml corresponds to the key "foo" in this file
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# This file should be translated.

# "description" property - description of the feature
description=\
Erlaubt KI-Agenten wie Claude Code, die Dateien lokaler IFS-Projekte auf der IBM i zu übersetzen \
und ihre Syntax dort zu prüfen: fügt dem MCP-Server von iAgentBridge die Tools \
"ifs_projects_compile" und "ifs_projects_check_syntax" hinzu. Erfordert iAgentBridge 1.1.0 oder neuer.

