# "description" property - description of the feature
description=\
Liest die Kompilierbefehle der Header des Befehls "COMPILE" von Alan Campin, damit die \
Migration in ein IFS-Projekt den Objekttyp und die Include-Datei eines Elements kennt. \
Installieren Sie es, wenn Ihre Elemente solche Header haben.

