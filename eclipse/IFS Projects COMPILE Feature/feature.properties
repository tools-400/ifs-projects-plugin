# feature.properties
# contains externalized strings for feature.xml
# "%foo" in feature.xml corresponds to the key "foo" in this file
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# This file should be translated.

# "description" property - description of the feature
description=\
Reads the compile commands of the headers of the "COMPILE" command of Alan Campin, so that the \
migration to an IFS project knows the object type and the include file of a member. Install it, \
if your members have such headers.

