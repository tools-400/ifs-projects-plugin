# feature.properties
# contains externalized strings for feature.xml
# "%foo" in feature.xml corresponds to the key "foo" in this file
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# This file should be translated.

# "description" property - description of the feature
description=\
Work on Code for IBM i projects (iproj.json) in RDi: projects whose source files are stream \
files in the IFS and that are built on the IBM i.\n\
\n\
"IFS Projects" adds to RDi:\n\
- IFS projects: directories in the IFS, which you edit, build and check like a project.\n\
- Local IFS projects: projects on your PC, e.g. a Git working copy. They are copied to the IFS \
and built there.\n\
- SSH terminal: a command line (shell) of the IBM i in a view of RDi.\n\
- Export to a library: the source files of a project are copied into source members.\n\
- Migration to an IFS project: the members of source files are copied into a new IFS project.\n\
\n\
The build runs with TOBi (makei) or GNU Make (gmake) in an SSH terminal. The compile errors are \
shown in the "Error List" view.\n\
\n\
Parsers for the headers, that build tools write into source members, are available as features \
of their own: STRPREPRC, BUILD, COMPILE and CPLCAS Headers.

