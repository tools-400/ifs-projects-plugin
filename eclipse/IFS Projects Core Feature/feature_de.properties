# This file should be translated.

# "description" property - description of the feature
description=\
Arbeiten Sie in RDi an Code-for-IBM-i-Projekten (iproj.json): Projekte, deren Quelldateien \
Stream-Dateien im IFS sind und die auf einer IBM i gebaut werden.\n\
\n\
"IFS Projects" erweitert RDi um:\n\
- IFS-Projekte: Verzeichnisse im IFS, die Sie wie ein Projekt bearbeiten, bauen und prüfen.\n\
- Lokale IFS-Projekte: Projekte auf Ihrem PC, z. B. eine Git-Arbeitskopie. Sie werden ins IFS \
kopiert und dort gebaut.\n\
- SSH-Terminal: eine Befehlszeile (Shell) der IBM i in einer Sicht von RDi.\n\
- Export in eine Bibliothek: die Quelldateien eines Projekts werden in Quellelemente kopiert.\n\
- Migration in ein IFS-Projekt: die Elemente von Quelldateien werden in ein neues IFS-Projekt \
kopiert.\n\
\n\
Gebaut wird mit TOBi (makei) oder GNU Make (gmake) in einem SSH-Terminal. Die Kompilierfehler \
werden in der Sicht "Error List" angezeigt.\n\
\n\
Parser für die Header, die Build-Werkzeuge in Quellelemente schreiben, gibt es als eigene \
Features: STRPREPRC, BUILD, COMPILE und CPLCAS Headers.

