Description_preference_page=Lets AI agents like Claude Code compile the files of local IFS projects on the IBM i and check their syntax there with the tools ifs_projects_compile and ifs_projects_check_syntax of iAgentBridge. The tools upload the changes of the project to its deploy directory first.
Label_Allow_compile=Allow AI agents to compile on the IBM i
Label_Warning_commands=Caution: an agent can change the files of a project, e.g. iproj.json and Rules.mk, and so run any command on the IBM i with the user profile of the RSE connection. Allow it only for projects and agents, that you trust.
Label_Approve_projects_in_properties=In addition, approve each project in its properties: Project > Properties > IFS Project > iAgentBridge.

